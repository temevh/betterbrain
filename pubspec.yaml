name: namer_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  english_words: ^4.0.0
  provider: ^6.1.5
  table_calendar: ^3.2.0
  firebase_core: ^4.0.0
  cloud_firestore: ^6.0.0
  font_awesome_flutter: ^10.9.0
  firebase_auth: ^6.0.1
  google_sign_in: ^6.2.1
  intl: ^0.20.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  fonts:
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-VariableFont_wght.ttf
  uses-material-design: true
  assets:
    - assets/images/
